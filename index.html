<style>
:root{color-scheme:light;--g:#0d4cb3;--gd:#0b3a8f;--gl:#e3edfc;--bg:#f5f9ff;--bgi:linear-gradient(180deg,#f7faff,#e8f0fc);--card:#fff;--tx:#14305f;--mu:#6b7fa3;--ln:#d3e0f4;--red:#d64545;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bgi);background-attachment:fixed;color:var(--tx);font-family:Tajawal,Tahoma,sans-serif;font-size:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font-family:inherit;cursor:pointer;border:0}
#splash{position:fixed;inset:0;background:var(--bgi);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .6s,transform .6s}
#splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
.logo{width:92px;height:92px;border-radius:28px;background:var(--g);display:grid;place-items:center;font-size:46px;animation:pop .8s cubic-bezier(.2,1.4,.4,1) both,float 3s 1s ease-in-out infinite}
#splash h1{color:var(--g);font-size:30px;margin:26px 0 8px;animation:up .8s .5s both}
#splash p{color:var(--mu);font-size:19px;margin:0;animation:up .8s .9s both}
.bar{width:140px;height:4px;border-radius:4px;background:var(--ln);margin-top:34px;overflow:hidden;animation:up .5s 1.2s both}
.bar i{display:block;height:100%;background:var(--g);animation:fill 1.6s 1.3s linear both}
@keyframes pop{from{transform:scale(0) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes fill{from{width:0}to{width:100%}}
#app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;margin:10px 14px 4px;padding:6px 18px 10px;background:var(--card);border-radius:999px;box-shadow:0 4px 16px rgba(13,76,179,.14)}

main{flex:1;overflow-y:auto;padding:18px 16px 28px;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%)}
nav{display:flex;background:var(--card);margin:4px 14px 10px;border-radius:999px;box-shadow:0 4px 16px rgba(13,76,179,.15);overflow:hidden}

nav button.on{color:var(--g);font-weight:700}
.card{background:var(--card);border-radius:22px;padding:14px 16px;margin-bottom:12px;border:1px solid var(--ln);box-shadow:0 2px 10px rgba(13,76,179,.08)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.lab{color:var(--mu);font-size:13px}

.ib{background:none;font-size:14px;font-weight:700;padding:6px 8px;border-radius:10px;color:var(--g)}

.chip{background:var(--card);border:1px solid var(--ln);color:var(--tx);border-radius:20px;padding:8px 14px;white-space:nowrap;font-size:15px}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.empty{text-align:center;color:var(--mu);padding:30px 0}
.badge{background:var(--gl);color:var(--gd);border-radius:10px;padding:2px 10px;font-size:13px;font-weight:700}

.pill.p{background:var(--g);color:#fff;border-color:var(--g)}

.f{margin-bottom:12px}

.lbtn{width:100%;padding:16px;border-radius:30px;background:#0d4cb3;color:#fff;font-size:19px;font-weight:700;box-shadow:0 8px 20px rgba(13,76,179,.3);margin-top:6px}
.l2{background:none;color:#1458c9;font-size:15px;font-weight:700;margin-top:18px;padding:6px}
.l3{background:#fff;color:#14305f;border:1px solid #d3e0f4;padding:9px 18px;border-radius:14px;margin-top:8px;font-size:15px}
.hav{width:58px;height:58px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 2px 8px rgba(13,76,179,.3)}
.pen{position:absolute;bottom:-8px;left:50%;margin-left:-21px;background:var(--g);color:#fff;font-size:10px;font-weight:700;line-height:1;border:2px solid #fff;border-radius:10px;padding:3px 8px;white-space:nowrap;box-shadow:0 2px 6px rgba(13,76,179,.35)}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

#main.pg>*{animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) both}
#main.pg>*:nth-child(2){animation-delay:.05s}#main.pg>*:nth-child(3){animation-delay:.1s}#main.pg>*:nth-child(4){animation-delay:.15s}#main.pg>*:nth-child(5){animation-delay:.2s}#main.pg>*:nth-child(6){animation-delay:.25s}#main.pg>*:nth-child(7){animation-delay:.3s}#main.pg>*:nth-child(8){animation-delay:.35s}#main.pg>*:nth-child(n+9){animation-delay:.4s}
#ov.show{animation:fadeIn .25s both}
#tst{animation:fadeUp .3s both}
button{transition:transform .15s,background .25s,color .25s}
button:active{transform:scale(.94)}
.chip{transition:background .25s,color .25s,border-color .25s}
#login .ph{animation:pop .8s cubic-bezier(.2,1.4,.4,1) both}

/* generic form: fields [{k,l,t:'text'|'tel'|'select'|'number',o:[...],v,max}] */
var formCb=null,formFields=null;
function form(title,fields,cb){
  formCb=cb;formFields=fields;
  var h="<h3>"+title+"</h3>";
  fields.forEach(function(f,i){
    h+='<div class="f"><label>'+f.l+'</label>';
    if(f.t==="select"){h+='<select id="ff'+i+'">'+f.o.map(function(o){return"<option"+(o===f.v?" selected":"")+">"+esc(o)+"</option>";}).join("")+"</select>";}
    else if(f.t==="area")h+='<textarea id="ff'+i+'" rows="'+(f.rows||6)+'" dir="auto" style="resize:vertical">'+esc(f.v)+'</textarea>';
    else h+='<input id="ff'+i+'" type="'+(f.t||"text")+'"'+(f.t==="number"?' step="0.25" inputmode="decimal"':"")+' value="'+esc(f.v)+'">';
    h+="</div>";
  });
  h+='<div class="btns"><button class="no" onclick="formCancel()">إلغاء</button><button class="ok" onclick="submitForm()">حفظ</button></div>';
  sheet(h);
}
function submitForm(){
  var out={};
  for(var i=0;i<formFields.length;i++){
    var f=formFields[i],v=document.getElementById("ff"+i).value.trim();
    if(f.t==="number"){v=v===""?"":Math.min(f.max,Math.max(0,parseFloat(v)||0));}
    else if(f.req&&!v){toast("يرجى ملء: "+f.l);return;}
    out[f.k]=v;
  }
  closeSheet();formCb(out);save();render();var f=window._af;window._af=null;if(f)f();
}
var delCb=null;
function confirmDel(msg,cb){
  delCb=cb;
  sheet("<h3>تأكيد الحذف</h3><p style='color:var(--mu);margin:0 0 16px'>"+msg+"<br>لا يمكن التراجع عن هذا الإجراء.</p><div class='btns'><button class='no' onclick='formCancel()'>إلغاء</button><button class='dg' onclick='doDel()'>نعم، احذف</button></div>");
}
function doDel(){closeSheet();delCb();save();render();toast("تم الحذف");var f=window._af;window._af=null;if(f)f();}

/* grades */
function ptotal(s,p){
  var g=s.gm&&SJ&&s.gm[SJ.id]&&s.gm[SJ.id][p];if(!g)return null;if(SJ.type!=="en")return +g.t||0;
  var t=0;SK.forEach(function(k){t+=+g[k[0]]||0;});t+=+g.e||0;return Math.round(t*100)/100;
}
function finalAvg(s){
  var t=0,n=0;for(var p=0;p<6;p++){var v=ptotal(s,p);if(v!==null){t+=v;n++;}}
  return n?Math.round(t/n*10)/10:null;
}

/* PDF */
function absCount(c,s){var n=0;for(var k in c.att)if(c.att[k][s.id]==="a")n++;return n;}
async function saveFile(name,blob){
  var dl=null;
  try{dl=window.claude&&await window.claude.use("downloads");}catch(e){if(e&&e.code==="declined")return;}
  try{
    if(dl){await dl.save({filename:name,data:blob});}
    else{var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast("تم حفظ الملف");}
  }catch(e){if(!e||e.code!=="declined")toast("تعذر حفظ الملف");}
}
function mkPdf(imgs,W,H,PW,PH){PW=PW||842;PH=PH||595;
  var enc=new TextEncoder(),parts=[],off=0,xref=[],N=imgs.length,kids=[],i,n;
  function add(b){if(typeof b==="string")b=enc.encode(b);parts.push(b);off+=b.length;}
  function o(k,body){xref[k]=off;add(k+" 0 obj\n"+body+"\nendobj\n");}
  add("%PDF-1.4\n");
  for(i=0;i<N;i++)kids.push((3+3*i)+" 0 R");
  o(1,"<</Type/Catalog/Pages 2 0 R>>");
  o(2,"<</Type/Pages/Kids["+kids.join(" ")+"]/Count "+N+">>");

function defHdr(e){

  return{r1:"وزارة التربية",r2:"مديرية تربية "+(e.prov||"........................"),r3:"مدرسة "+(sc.name||"........................")+(sc.shift?" ("+sc.shift+")":""),

function fixEx(e){
  if(!e.h)e.h=defHdr(e);
  if(!e.th)e.th={acc:"#0d4cb3",font:""};
  if(!e.st)e.st={};
  e.qs.forEach(function(q){
    if(q.type===TXT){q.text=q.text||"";return;}
    if(!q.items){q.items=itemsOf(q).map(function(l){if(q.type===QT[0]){var p=l.split("|").map(function(s){return s.trim();});return{t:p[0],o:p.slice(1)};}return{t:l,o:[]};});}
  });
}
function newItem(t){return{t:"",o:t===QT[0]?["","","",""]:[]};}
var DTITLE={en:["Choose the correct answer:","True or False:","Fill in the blanks:","Answer the following questions:"],ar:["اختر الإجابة الصحيحة:","ضع علامة (صح) أو (خطأ):","أكمل الفراغات الآتية:","أجب عن الأسئلة الآتية:"]};
function addQSheet(){
  sheet("<h3>إضافة إلى الورقة</h3><div class='btns' style='flex-direction:column'>"+QT.map(function(t,i){return"<button class='ok' onclick='addQ("+i+")'>سؤال: "+t+"</button>";}).join("")+"<button class='ok' style='background:#7a3db8' onclick='addQ(4)'>نص جديد (فقرة أو ملاحظة)</button><button class='no' onclick='closeSheet()'>إلغاء</button></div>");
}
function addQ(i){
  var e=byId(EX(),curEx);
  if(i===4)e.qs.push({id:uid(),type:TXT,text:"",marks:0});
  else e.qs.push({id:uid(),title:DTITLE[e.lang==="ar"?"ar":"en"][i],type:QT[i],marks:10,lines:3,items:[newItem(QT[i])]});

}

function gst(e,p){return(e.st&&e.st[skey(p)])||{};}
function stCss(e,p){
  var s=gst(e,p),c="",f=s.f||(e.th&&e.th.font);

async function imgRows(f){

  var d=await sample.json("الصورة المرفقة قائمة أو جدول لطلاب (أسماء وقد يكون معها أرقام أو درجات). استخرج كل الصفوف الظاهرة بدقة من الأعلى إلى الأسفل، واكتب الأسماء كما هي مكتوبة بالضبط بدون تغيير أو تصحيح. أرجع JSON فقط بهذا الشكل: {\"rows\":[[\"نص العمود الأول\",\"نص العمود الثاني\"]]}. كل صف مصفوفة نصوص بترتيب الأعمدة كما تُقرأ في الجدول (من اليمين لليسار إن كان الجدول عربياً). إذا كان في الجدول صف عناوين ضعه أولاً، وإلا فلا تضف عناوين. اكتب الأرقام بالأرقام الإنكليزية. لا تخترع صفوفاً غير موجودة ولا تضف أي شرح.",{images:[blob],modelTier:"default"});
